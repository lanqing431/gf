name: GoFrame Main CI
on:
  push:
    branches:
      - master
      - develop
      - personal/**
      - feature/**
      - enhance/**
      - fix/**
  pull_request:
    branches:
      - master
      - develop
      - personal/**
      - feature/**
      - enhance/**
      - fix/**
  workflow_dispatch:
    inputs:
      debug:
        type: boolean
        description: Enable tmate Debug
        required: false
        default: false
concurrency:
  group: ${{ github.workflow }} @ ${{ github.event.pull_request.head.label ||
    github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}
env:
  TZ: Asia/Shanghai
  LATEST_GO_VERSION: "1.27"
jobs:
  code-test:
    strategy:
      matrix:
        go-version:
          - "1.25"
          - "1.26"
          - "1.27"
        group:
          - core
        include:
          - go-version: "1.27"
            group: drivers-1
          - go-version: "1.27"
            group: drivers-2
          - go-version: "1.27"
            group: "386"
    runs-on: ubuntu-latest
    steps:
      - name: Setup Timezone
        run: sudo ln -sf /usr/share/zoneinfo/Asia/Shanghai /etc/localtime
      - name: Checkout Repository
        uses: actions/checkout@v7
      - name: Setup tmate Session
        uses: mxschmitt/action-tmate@v3
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.debug }}
        with:
          detached: true
          limit-access-to-actor: false
      - name: Free Disk Space
        run: |
          df -h /
          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/lib/android \
            /usr/local/share/boost \
            /usr/share/swift \
            /opt/ghc \
            /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL \
            /opt/hostedtoolcache/Python \
            /opt/hostedtoolcache/PyPy \
            /opt/hostedtoolcache/Ruby \
            /opt/hostedtoolcache/node || true
          df -h /
      - name: Start Services
        run: >
          case "${{ matrix.group }}" in
            386)
              echo "The 386 group only builds the root module and needs no service."
              exit 0
              ;;
            core)
              # `cmd/gf` belongs to this group and its tests hit real mysql, mariadb and
              # postgres instances on every Go version, while the contrib backends below
              # are only exercised on the latest one (see ci-main.sh).
              services="mysql mariadb postgres"
              if [ "${{ matrix.go-version }}" = "$LATEST_GO_VERSION" ]; then
                services="mysql mariadb postgres etcd redis polaris zookeeper"
              fi
              ;;
            drivers-1)
              services="mssql oracle dm oceanbase"
              ;;
            drivers-2)
              services="mysql mariadb postgres clickhouse gaussdb tidb"
              ;;
            *)
              echo "Unknown group '${{ matrix.group }}': add its services here." >&2
              exit 1
              ;;
          esac

          bash .github/workflows/scripts/docker-services.sh start "$services"

          # The `services:` block waited for the containers declaring a
          HEALTHCHECK to

          # report `healthy` before running any step, and several test packages
          connect

          # from a package level `init()` and fail at once. The same wait is
          reproduced

          # here: `healthy` where a HEALTHCHECK is declared, an open published
          port

          # otherwise.

          bash .github/workflows/scripts/docker-services.sh wait "$services"
      - name: Start Compose Services
        if: ${{ matrix.group == 'core' && matrix.go-version == env.LATEST_GO_VERSION }}
        run: >
          docker compose -f .github/workflows/apollo/docker-compose.yml up -d
          --build

          docker compose -f .github/workflows/nacos/docker-compose.yml up -d
          --build

          docker compose -f .github/workflows/redis/docker-compose.yml up -d
          --build

          docker compose -f .github/workflows/consul/docker-compose.yml up -d
          --build
      - name: Wait for Apollo to serve configuration
        if: ${{ matrix.group == 'core' && matrix.go-version == env.LATEST_GO_VERSION }}
        run: >
          # A running container is not enough: apollo-quick-start imports its
          seed

          # data after boot, and until that finishes the config service answers

          # normally but without the keys the tests read.

          for i in $(seq 1 60); do
            if curl -fsS --connect-timeout 2 --max-time 5 "http://localhost:8080/configs/SampleApp/default/application" | grep -Fq '"server.address"'; then
              echo "Apollo is serving configuration."
              exit 0
            fi
            sleep 5
          done

          echo "Apollo did not start serving configuration within 5 minutes."

          docker compose -f ".github/workflows/apollo/docker-compose.yml" logs
          --tail=50

          exit 1
      - name: Setup Golang ${{ matrix.go-version }}
        uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go-version }}
          cache: false
      - name: Get current month
        id: cache-month
        run: echo "month=$(date +%Y%m)" >> "$GITHUB_OUTPUT"
      - name: Restore Go module cache
        id: mod-cache
        uses: actions/cache/restore@v6
        with:
          path: ~/go/pkg/mod
          key: ${{ runner.os }}-go-mod-main-${{ matrix.group == '386' && 'core' ||
            matrix.group }}-${{ hashFiles('**/go.sum') }}
          restore-keys: >
            ${{ runner.os }}-go-mod-main-${{ matrix.group == '386' && 'core' ||
            matrix.group }}-
      - name: Restore Go build cache
        id: build-cache
        uses: actions/cache/restore@v6
        with:
          path: ~/.cache/go-build
          key: ${{ runner.os }}-go-build-main-${{ matrix.go-version }}-${{ matrix.group
            }}-${{ steps.cache-month.outputs.month }}
          restore-keys: >
            ${{ runner.os }}-go-build-main-${{ matrix.go-version }}-${{
            matrix.group }}-
      - name: Install Protoc
        uses: arduino/setup-protoc@v3
        with:
          version: 31.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Install the protocol compiler plugins for Go
        run: >
          # Pinned: protoc-gen-go-grpc v1.6.0 requires Go >= 1.24 and v1.6.2
          requires

          # Go >= 1.25, either of which breaks the older matrix entries.

          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.12

          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@v1.5.1

          export PATH="$PATH:$(go env GOPATH)/bin"
      - name: Before Script
        run: bash .github/workflows/scripts/before_script.sh
      - name: Build & Test
        if: ${{ (github.event_name == 'push' && github.ref != 'refs/heads/master') ||
          github.event_name == 'workflow_dispatch' }}
        run: bash .github/workflows/scripts/ci-main.sh ${{ matrix.group }}
      - name: Build & Test & Coverage
        if: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/master') ||
          github.event_name == 'pull_request' }}
        run: bash .github/workflows/scripts/ci-main.sh ${{ matrix.group }} coverage
      - name: Save Go module cache
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' &&
          matrix.go-version == env.LATEST_GO_VERSION && matrix.group != '386' &&
          steps.mod-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v6
        with:
          path: ~/go/pkg/mod
          key: ${{ steps.mod-cache.outputs.cache-primary-key }}
      - name: Save Go build cache
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' &&
          steps.build-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v6
        with:
          path: ~/.cache/go-build
          key: ${{ steps.build-cache.outputs.cache-primary-key }}
      - name: Stop Services
        if: always()
        run: >
          for service in apollo nacos redis consul; do
            docker compose -f ".github/workflows/$service/docker-compose.yml" down || true
          done

          bash .github/workflows/scripts/docker-services.sh clean || true
      - name: Report Coverage
        uses: codecov/codecov-action@v7
        if: ${{ always() && (github.event_name == 'push' && github.ref ==
          'refs/heads/master' || github.event_name == 'pull_request') &&
          matrix.go-version == env.LATEST_GO_VERSION && matrix.group != '386' }}
        with:
          flags: go-${{ matrix.go-version }}-${{ matrix.group }}
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
